<!-- Item Cards -->

<a href="/items/{{ item.item_pk }}?lan={{ lan }}" mix-get class="item">
    <img src="{{ image_path(item.item_image) }}" alt="{{ item.item_name }}">
    <p>
        {{ item.item_name }}
    </p>
    {% if lan == 'en' %}
    <div>
    {{ "{:,}".format(item.item_price) }} USD
    </div>
{% else %}
    <div>
    {{ "{:,.0f}".format(item.item_price * rates.rates.DKK) }} DKK
    </div>
{% endif %}
</a>
