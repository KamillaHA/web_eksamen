<!-- Navigation Bar -->

<nav>

<!-- Logo -->
    <div id="logo_container">
        <a href="{{ url_for('index', lan=lan) }}" class="logo-link">
            Vejhylden <span class="nav-subtitle"> - {{ translate('nav', lan) }}</span>
        </a>
        
    </div>


    <div id="nav_right">
        
    <!-- Language Switcher -->
        <div>
            <a href="javascript:void(0)"
            onclick="switchLang('dk')"
            title="Dansk">🇩🇰</a> 
            <strong>/</strong>
            <a href="javascript:void(0)"
            onclick="switchLang('en')"
            title="English">🇬🇧</a>
        </div>

        <!-- Login / Logout -->
    {% if not user %}
        <a href="{{ url_for('login', lan=lan) }}">{{ translate('login', lan) }}</a>

    {% else %}
        {% if user.user_is_admin %}
            <a href="{{ url_for('admin', lan=lan) }}">
                {{ translate('panel_btn', lan) }}
            </a>
        {% else %}
            <a href="{{ url_for('profile', lan=lan) }}">
                {{ translate('profile_btn', lan) }}
            </a>
        {% endif %}

        <a href="{{ url_for('logout', lan=lan) }}">
            {{ translate('logout', lan) }}
        </a>
    {% endif %}

    </div>
</nav>
