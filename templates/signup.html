    <h1>Opret bruger</h1>

    <form action="{{ url_for('post_signup', lan=lan) }}" method="post">
        <div>
            <label for="">
                <span>Navn</span>
            </label>
            <input name="user_name" type="text" mix-check="{{ x.USER_NAME_REGEX }}">
        </div> 

        <div>
            <label for="">
                <span>Efternavn</span>
            </label>
            <input name="user_last_name" type="text" mix-check="{{ x.USER_LAST_NAME_REGEX }}">
        </div>

        <div>
            <label for="">
                <span>Email</span>
                <span></span>
            </label>
            <input name="user_email" type="text" mix-check="{{ x.USER_EMAIL_REGEX }}">
        </div>

        <div>
            <label for="">
                <span>Brugernavn</span>
                <span>{{ x.USER_USERNAME_MIN }} til {{ x.USER_USERNAME_MAX }} karakterer</span>
            </label>
            <input name="user_username" type="text" mix-check="{{ x.USER_USERNAME_REGEX }}">
        </div>        

        <div>
            <label for="">
                <span>Password</span>
                <span>{{ x.USER_PASSWORD_MIN }} til {{ x.USER_PASSWORD_MAX }} karakterer</span>
            </label>
            <input name="user_password" type="password" mix-check="{{ x.USER_PASSWORD_REGEX }}">
        </div>        
        <button type="submit">Opret bruger</button>
    </form>

</main>
