<!-- Sign Up Page -->

{% include "_header.html" %}
{% include "_nav.html" %}

<main class="log_main">
  
  <form 
  action="{{ url_for('post_signup', lan=lan) }}" 
  method="POST" 
  >
  <h2 class="log_heading">{{ translate('sign_up', lan) }}</h2>
    {% set old = old_values if old_values is defined else {} %}

    <div>
      <label for="user_name">
        <span>{{ translate('user_name', lan) }}</span>
      </label>
      <input
        id="user_name"
        name="user_name"
        type="text"
        value="{{ old.user_name or '' }}"
        class="{{ 'error' if user_name_error else '' }}" 
        pattern="{{ x.USER_NAME_REGEX }}"
        title="{{ translate('invalid_name', lan) }}"
      >
    </div> 

    <div>
      <label for="user_last_name">
        <span>{{ translate('user_lastname', lan) }}</span>
      </label>
      <input
        id="user_last_name"
        name="user_last_name"
        type="text"
        value="{{ old.user_last_name or '' }}"
        class="{{ 'error' if user_last_name_error else '' }}" 
        pattern="{{ x.USER_LAST_NAME_REGEX }}"
        title="{{ translate('invalid_lastname', lan) }}"
      >
    </div>

    <div>
      <label for="user_email">
        <span>Email</span>
      </label>
      <input
        id="user_email"
        name="user_email"
        type="email"
        value="{{ old.user_email or '' }}"
        class="{{ 'error' if user_email_error else '' }}" 
        pattern="{{ x.REGEX_EMAIL }}"
        title="{{ translate('invalid_email', lan) }}"
      >
    </div>

    <div>
      <label for="user_username">
        <span>{{ translate('user_username', lan) }}</span>
      </label>
      <input
        id="user_username"
        name="user_username"
        type="text"
        value="{{ old.user_username or '' }}"
        class="{{ 'error' if user_username_error else '' }}" 
        pattern="{{ x.USER_USERNAME_REGEX }}"
        placeholder="{{ x.USER_USERNAME_MIN }}–{{ x.USER_USERNAME_MAX }} {{ translate('characters', lan) }}"
        title="{{ translate('invalid_username', lan) }}"
      >
    </div>        

    <div>
      <label for="user_password">
        <span>{{ translate('password', lan) }}</span>
      </label>
      <input
        id="user_password"
        name="user_password"
        type="password"
        class="{{ 'error' if user_password_error else '' }}" 
        pattern="{{ x.USER_PASSWORD_REGEX }}"
        placeholder="{{ x.USER_PASSWORD_MIN }}–{{ x.USER_PASSWORD_MAX }} {{ translate('characters', lan) }}"
        title="{{ translate('invalid_password', lan) }}"
      >
    </div>        

    <button type="submit">
      {{ translate('sign_up', lan) }}
    </button>
  </form>
</main>

{% include "_footer.html" %}
